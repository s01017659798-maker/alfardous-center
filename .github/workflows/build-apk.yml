name: Build Alfardous APK

on:
  workflow_dispatch:
  push:
    paths:
              - 'alfardous_android_3_5_0.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
                    unzip -q alfardous_android_3_5_0.zip -d .
          test -f alfardous_android/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p alfardous_android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alfardous-center-apk
          path: alfardous_android/app/build/outputs/apk/debug/app-debug.apk

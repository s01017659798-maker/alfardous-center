<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امتحان سنتر الفردوس</title><style>body{font-family:Tahoma,Arial;background:#f2f5f8;color:#17233b;margin:0;padding:16px}.wrap{max-width:760px;margin:auto}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #10204012}.brand{background:#10294b;color:#e7c66e;text-align:center}.brand h1{margin:4px}.field,input,button{font:inherit}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5df;border-radius:9px;margin:6px 0 12px}button{border:0;border-radius:9px;padding:12px 18px;background:#c6a34a;color:#10294b;font-weight:bold;cursor:pointer}.muted{color:#667085;font-size:14px}.q{border-right:4px solid #c6a34a}.opt{display:block;padding:9px;background:#f7f8fa;border-radius:8px;margin:7px 0}.hidden{display:none}.clock{font-size:22px;font-weight:bold;color:#9b6d0c}button:disabled{opacity:.5}</style><div class="wrap"><header class="card brand"><h1>سنتر الفردوس التعليمي</h1><div>بوابة الامتحان الإلكتروني</div></header><section id="entry" class="card"><h2>دخول الامتحان</h2><label>كود الامتحان</label><input id="code" placeholder="اكتب كود الامتحان"><label>كود الطالب أو رقم جلوسه</label><input id="student" placeholder="اكتب كود الطالب"><button id="load">دخول الامتحان</button><p class="muted">تأكد من اتصال الإنترنت قبل البدء.</p></section><section id="exam" class="hidden"><div class="card"><h2 id="title"></h2><div class="clock" id="clock"></div><p id="instructions" class="muted">يتم حفظ إجاباتك مؤقتًا على هذا الهاتف. اضغط إرسال عند الانتهاء.</p></div><div id="questions"></div><div class="card"><button id="submit">إرسال الإجابات وإنهاء الامتحان</button><p id="status" class="muted"></p></div></section><section id="done" class="card hidden"><h2>تم استلام إجاباتك</h2><p>احتفظ بكود الطالب. ستظهر النتيجة بعد اعتمادها من السنتر.</p></section></div><script>
const $=id=>document.getElementById(id);let exam=null,api=new URLSearchParams(location.search).get('api')||'',seconds=0,timer=null,answers={},studentCode='',examCode='';
function apiReady(){if(!api){alert('رابط خادم الامتحانات لم يُضبط بعد. اطلب رابط الدخول من السنتر.');return false}return true}
$('load').onclick=async()=>{examCode=$('code').value.trim();studentCode=$('student').value.trim();if(!examCode||!studentCode){alert('اكتب كود الامتحان وكود الطالب');return}if(!apiReady())return;$('load').disabled=true;try{let r=await fetch(api.replace(/\/$/,'')+'/exam/'+encodeURIComponent(examCode)+'?student='+encodeURIComponent(studentCode));if(!r.ok)throw Error(r.status===404?'الكود غير صحيح أو الامتحان غير منشور':'تعذر تحميل الامتحان');exam=await r.json();if(!exam.questions?.length)throw Error('لا توجد أسئلة منشورة');$('title').textContent=exam.title;$('questions').innerHTML=exam.questions.map((q,i)=>`<article class="card q"><strong>${i+1}. ${esc(q.text)}</strong>${q.image?`<img src="${q.image}" style="display:block;max-width:100%;max-height:260px;margin:12px auto">`:''}${(q.options||['صح','خطأ']).map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" style="width:auto;margin:0 0 0 8px">${esc(o)}</label>`).join('')}</article>`).join('');let key='fardous-draft-'+examCode+'-'+studentCode;try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch{answers={}};document.querySelectorAll('#questions input').forEach(el=>{let i=Number(el.name.slice(1));if(String(answers[i])===el.value)el.checked=true;el.onchange=()=>{answers[i]=Number(el.value);localStorage.setItem(key,JSON.stringify(answers))}});seconds=(exam.duration||30)*60;$('entry').classList.add('hidden');$('exam').classList.remove('hidden');tick();timer=setInterval(tick,1000)}catch(e){alert(e.message||'حدث خطأ في الاتصال')}finally{$('load').disabled=false}};
function tick(){let m=Math.floor(seconds/60),s=seconds%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){clearInterval(timer);send(true)}else seconds--}
$('submit').onclick=()=>{if(confirm('هل تريد إرسال إجاباتك وإنهاء الامتحان؟'))send(false)};
async function send(auto){if(!exam||$('submit').disabled)return;$('submit').disabled=true;clearInterval(timer);$('status').textContent='جارٍ إرسال الإجابات...';try{let r=await fetch(api.replace(/\/$/,'')+'/exam/'+encodeURIComponent(examCode)+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_code:studentCode,answers,auto_submit:auto,client_submitted_at:new Date().toISOString()})});let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.message||'لم يتم استلام الإجابات. احتفظ بالصفحة وحاول الاتصال بالسنتر.');localStorage.removeItem('fardous-draft-'+examCode+'-'+studentCode);$('exam').classList.add('hidden');$('done').classList.remove('hidden')}catch(e){$('status').textContent='تعذر الإرسال: '+e.message+' — إجاباتك ما زالت محفوظة على هذا الهاتف. أعد المحاولة عند عودة الإنترنت.';$('submit').disabled=false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></html>
